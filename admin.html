<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f7fb;
    color:#172033;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(
        135deg,
        #071952,
        #088395
    );

    color:white;
    padding:20px 6%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.logo span{
    color:#35e0a1;
}

.header-buttons{
    display:flex;
    gap:10px;
}

.home-btn,
.logout-btn{
    border:none;
    padding:10px 18px;
    border-radius:20px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

.home-btn{
    background:#35e0a1;
    color:#071952;
}

.logout-btn{
    background:#e74c3c;
    color:white;
}

/* ================= CONTAINER ================= */

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
}

/* ================= CARD ================= */

.card{
    background:white;
    padding:25px;
    border-radius:16px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.08);

    margin-bottom:25px;
}

.card h2{
    color:#071952;
    margin-bottom:20px;
}

/* ================= USER ================= */

.user-info{
    margin-bottom:20px;
    padding:13px;

    background:#eef7ff;

    border-radius:8px;

    color:#071952;

    font-weight:bold;
}

/* ================= FORM ================= */

.form-grid{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
    color:#26364d;
}

input,
select,
textarea{

    width:100%;

    padding:13px;

    border:1px solid #d5dce5;

    border-radius:8px;

    outline:none;

    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{

    border-color:#088395;

    box-shadow:
    0 0 0 3px rgba(8,131,149,.10);

}

textarea{
    min-height:100px;
    resize:vertical;
}

/* ================= BUTTON ================= */

.main-btn{

    width:100%;

    border:none;

    padding:15px;

    margin-top:20px;

    background:
    linear-gradient(
        135deg,
        #071952,
        #088395
    );

    color:white;

    border-radius:9px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

.main-btn:hover{
    opacity:.92;
}

.main-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ================= MESSAGE ================= */

.message{

    margin-top:18px;

    padding:13px;

    border-radius:8px;

    display:none;

    text-align:center;

    font-weight:bold;

}

.success{
    background:#e7f8ef;
    color:#087f5b;
}

.error{
    background:#ffecec;
    color:#c0392b;
}

/* ================= LIST ================= */

.material-list{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(270px,1fr)
    );

    gap:20px;

}

.material{

    border:1px solid #e1e7ee;

    border-radius:13px;

    padding:20px;

    background:white;

    transition:.2s;

}

.material:hover{

    transform:translateY(-3px);

    box-shadow:
    0 8px 20px rgba(0,0,0,.08);

}

.material-icon{
    font-size:40px;
    margin-bottom:10px;
}

.material h3{
    color:#071952;
    margin-bottom:10px;
}

.material p{
    color:#667085;
    margin:7px 0;
    line-height:1.5;
}

/* ================= BADGES ================= */

.badge{

    display:inline-block;

    padding:6px 10px;

    border-radius:15px;

    font-size:12px;

    font-weight:bold;

}

.free-badge{

    background:#e7f8ef;

    color:#087f5b;

}

.category-badge{

    background:#eaf7f7;

    color:#087f8d;

}

/* ================= VIEW ================= */

.view-btn{

    display:block;

    text-align:center;

    margin-top:15px;

    padding:10px;

    background:#071952;

    color:white;

    text-decoration:none;

    border-radius:7px;

    font-weight:bold;

}

.view-btn:hover{
    background:#088395;
}

/* ================= DELETE ================= */

.delete-btn{

    width:100%;

    margin-top:8px;

    padding:10px;

    border:none;

    border-radius:7px;

    background:#e74c3c;

    color:white;

    font-weight:bold;

    cursor:pointer;

}

.delete-btn:hover{

/* ================= EMPTY ================= */

.empty{

    padding:35px;

/* ================= WHATSAPP ================= */

.whatsapp{

    display:block;

    text-decoration:none;

    background:#25D366;

    color:white;

    padding:14px;

    border-radius:30px;

    font-weight:bold;

    margin-top:20px;

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{

        flex-direction:column;

        gap:15px;

        text-align:center;

    }

    .header-buttons{

        justify-content:center;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .form-group.full{

        grid-column:auto;
    }

    .container{

        width:94%;
    }

}

</style>

/* =================================================
   LOAD MATERIALS
================================================= */

async function loadMaterials(){

    materialsList.innerHTML = `

        <div class="empty">

            ⏳ Inapakia materials...

        </div>

    `;


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/materials?select=*&order=id.desc",

            {

                method:"GET",

                headers:getHeaders()

            }

        );


        if(!response.ok){

            const error =
                await response.text();

            throw new Error(
                "Database: " +
                error
            );

        }


        const materials =
            await response.json();


        if(
            !materials ||
            materials.length === 0
        ){

            materialsList.innerHTML = `

                <div class="empty">

                    📭 Hakuna materials bado.

                </div>

            `;

            return;

        }


        materialsList.innerHTML = "";


        materials.forEach(
            function(material){

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "material";


                const title =
                    material.title ||
                    "Material";


                const course =
                    material.course ||
                    "General";


                const category =
                    material.category ||
                    "Other";


                const description =
                    material.description ||
                    "Hakuna maelezo";


                const fileUrl =
                    material.file_url ||
                    "#";


                item.innerHTML = `

                    <div class="material-icon">

                        📚

                    </div>


                    <h3>

                        ${escapeHTML(title)}

                    </h3>


                    <p>

                        🎓
                        <strong>
                            Course:
                        </strong>

                        ${escapeHTML(course)}

                    </p>


                    <p>

                        <span class="badge category-badge">

                            ${escapeHTML(category)}

                        </span>

                        &nbsp;

                        <span class="badge free-badge">

                            🆓 FREE

                        </span>

                    </p>


                    <p>

                        ${escapeHTML(description)}

                    </p>


                    ${
                        fileUrl !== "#"
                        ?

                        `

                        <a
                            href="${escapeAttribute(fileUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="view-btn"
                        >

                            👁️ Fungua Material

                        </a>

                        `

                        :

                        ""

                    }


                    <button
                        class="delete-btn"
                        onclick="deleteMaterial(
                            '${escapeJS(String(material.id))}',
                            '${escapeJS(material.file_url || "")}'
                        )"
                    >

                        🗑️ Delete

                    </button>

                `;


                materialsList.appendChild(
                    item
                );

            }
        );

    }

    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        materialsList.innerHTML = `

            <div class="empty">

                ❌ Imeshindwa kupata materials.

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


/* =================================================
   UPLOAD MATERIAL
================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const title =
            document
            .getElementById("title")
            .value
            .trim();


        const course =
            document
            .getElementById("course")
            .value
            .trim();


        const category =
            document
            .getElementById("category")
            .value;


        const description =
            document
            .getElementById("description")
            .value
            .trim();


        const file =
            document
            .getElementById("file")
            .files[0];


        if(!file){

            showMessage(
                "❌ Chagua file kwanza.",
                "error"
            );

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "⏳ Inapakia...";


        try{

            const safeName =
                file.name
                .replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const filePath =
                "materials/" +
                Date.now() +
                "_" +
                safeName;


            /* =========================
               STORAGE
            ========================= */

            const uploadResponse =
            await fetch(

                SUPABASE_URL +
                "/storage/v1/object/matitohb/" +
                filePath,

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            ACCESS_TOKEN,

                        "Content-Type":
                            file.type ||
                            "application/octet-stream"

                    },

                    body:file

                }

            );


            if(!uploadResponse.ok){

                const error =
                    await uploadResponse.text();

                throw new Error(
                    "Storage: " +
                    error
                );

            }


            const fileUrl =
                SUPABASE_URL +
                "/storage/v1/object/public/matitohb/" +
                filePath;


            /* =========================
               DATABASE
            ========================= */

            const databaseResponse =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/materials",

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            ACCESS_TOKEN,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body:JSON.stringify({

                        title:
                            title,

                        course:
                            course,

                        category:
                            category,

                        type:
                            "FREE",

                        price:
                            0,

                        is_paid:
                            false,

                        description:
                            description,

                        file_url:
                            fileUrl,

                        file_name:
                            file.name

                    })

                }

            );


            if(!databaseResponse.ok){

                const error =
                    await databaseResponse.text();


                await fetch(

                    SUPABASE_URL +
                    "/storage/v1/object/matitohb/" +
                    filePath,

                    {

                        method:"DELETE",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                ACCESS_TOKEN

                        }

                    }

                );


                throw new Error(
                    "Database: " +
                    error
                );

            }


            showMessage(

                "✅ FREE material imehifadhiwa vizuri!",

                "success"

            );


            form.reset();


            await loadMaterials();

        }


        catch(error){

            console.error(
                "UPLOAD ERROR:",
                error
            );


            showMessage(

                "❌ " +
                error.message,

                "error"

            );

        }


        finally{

            button.disabled =
                false;

            button.textContent =
                "📤 Upload Material";

        }

    }
);


/* =================================================
   DELETE MATERIAL
================================================= */

async function deleteMaterial(
    id,
    fileUrl
){

    const confirmed =
        confirm(
            "Una uhakika unataka kufuta material hii?"
        );


    if(!confirmed){

        return;

    }


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/materials?id=eq." +
            encodeURIComponent(id),

            {

                method:"DELETE",

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        ACCESS_TOKEN,

                    "Prefer":
                        "return=minimal"

                }

            }

        );


        if(!response.ok){

            const error =
                await response.text();

            throw new Error(
                "Database: " +
                error
            );

        }


        /* DELETE STORAGE */

        if(fileUrl){

            const marker =
                "/object/public/matitohb/";


            const position =
                fileUrl.indexOf(
                    marker
                );


            if(position !== -1){

                const filePath =
                    fileUrl.substring(
                        position +
                        marker.length
                    );


                await fetch(

                    SUPABASE_URL +
                    "/storage/v1/object/matitohb/" +
                    filePath,

                    {

                        method:"DELETE",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                ACCESS_TOKEN

                        }

                    }

                );

            }

        }


        showMessage(

            "✅ Material imefutwa.",

            "success"

        );


        await loadMaterials();

    }


    catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );


        showMessage(

            "❌ Imeshindwa kufuta: " +
            error.message,

            "error"

        );

    }

}

                    <button

                        onclick="deleteAdvertisement(
                            ${Number(ad.id)}
                        )"
                    >

                        🗑️ Futa Tangazo

                    </button>

                `;


                adsList.appendChild(
                    item
                );

            }
        );

    }


    catch(error){

        console.error(
            "ADS LOAD ERROR:",
            error
        );


        adsList.innerHTML = `

            <div class="empty">

                ❌ Imeshindwa kupata matangazo.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}

adForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const title =
            document
            .getElementById(
                "adTitle"
            )
            .value
            .trim();


        const description =
            document
            .getElementById(
                "adDescription"
            )
            .value
            .trim();


        const link =
            document
            .getElementById(
                "adLink"
            )
            .value
            .trim();


        if(!title){

            showAdMessage(
                "❌ Weka kichwa cha tangazo.",
                "error"
            );

            return;

        }


        if(!description){

            showAdMessage(
                "❌ Weka maelezo ya tangazo.",
                "error"
            );

            return;

        }


        adButton.disabled =
            true;


        adButton.textContent =
            "⏳ Inaongeza...";


        try{

            const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/advertisements",

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            ACCESS_TOKEN,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body:JSON.stringify({

                        title:
                            title,

                        description:
                            description,

                        link:
                            link || null

                    })

                }

            );


            if(!response.ok){

                const error =
                    await response.text();

                throw new Error(
                    "Database: " +
                    error
                );

            }


            showAdMessage(

                "✅ Tangazo limeongezwa vizuri!",

                "success"

            );


            adForm.reset();


            await loadAdvertisements();

        }


        catch(error){

            console.error(
                "ADD AD ERROR:",
                error
            );


            showAdMessage(

                "❌ " +
                error.message,

                "error"

            );

        }


        finally{

            adButton.disabled =
                false;


            adButton.textContent =
                "📢 Ongeza Tangazo";

        }

    }
);


/* =================================================
   DELETE ADVERTISEMENT
================================================= */

async function deleteAdvertisement(
    id
){

    const confirmed =
        confirm(
            "Una uhakika unataka kufuta tangazo hili?"
        );


    if(!confirmed){

        return;

    }


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/advertisements?id=eq." +
            encodeURIComponent(id),

            {

                method:"DELETE",

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        ACCESS_TOKEN,

                    "Prefer":
                        "return=minimal"

                }

            }

        );


        if(!response.ok){

            const error =
                await response.text();

            throw new Error(
                "Database: " +
                error
            );

        }


        showAdMessage(

            "✅ Tangazo limefutwa.",

            "success"

        );


        await loadAdvertisements();

    }


    catch(error){

        console.error(
            "DELETE AD ERROR:",
            error
        );


        showAdMessage(

            "❌ Imeshindwa kufuta: " +
            error.message,

            "error"

        );

    }

}

/* =================================================
   SECURITY HELPERS
================================================= */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(text || "");


    return div.innerHTML;

}


function escapeAttribute(text){

    return String(text || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


function escapeJS(text){

    return String(text || "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );

}
