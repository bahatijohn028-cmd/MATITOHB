<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MATITOHB HUB - Admin</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f7fb;
    color:#172033;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(
        135deg,
        #071952,
        #088395
    );

    color:white;
    padding:20px 6%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.logo span{
    color:#35e0a1;
}

.header-buttons{
    display:flex;
    gap:10px;
}

.home-btn,
.logout-btn{
    border:none;
    padding:10px 18px;
    border-radius:20px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

.home-btn{
    background:#35e0a1;
    color:#071952;
}

.logout-btn{
    background:#e74c3c;
    color:white;
}

/* ================= CONTAINER ================= */

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
}

/* ================= CARD ================= */

.card{
    background:white;
    padding:25px;
    border-radius:16px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.08);

    margin-bottom:25px;
}

.card h2{
    color:#071952;
    margin-bottom:20px;
}

/* ================= USER ================= */

.user-info{
    margin-bottom:20px;
    padding:13px;

    background:#eef7ff;

    border-radius:8px;

    color:#071952;

    font-weight:bold;
}

/* ================= FORM ================= */

.form-grid{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
    color:#26364d;
}

input,
select,
textarea{

    width:100%;

    padding:13px;

    border:1px solid #d5dce5;

    border-radius:8px;

    outline:none;

    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{

    border-color:#088395;

    box-shadow:
    0 0 0 3px rgba(8,131,149,.10);

}

textarea{
    min-height:100px;
    resize:vertical;
}

/* ================= PRICE ================= */

.price-box{
    display:none;
}

.price-box.show{
    display:flex;
}

/* ================= UPLOAD ================= */

.upload-btn{

    width:100%;

    border:none;

    padding:15px;

    margin-top:20px;

    background:
    linear-gradient(
        135deg,
        #071952,
        #088395
    );

    color:white;

    border-radius:9px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

.upload-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ================= MESSAGE ================= */

.message{

    margin-top:18px;

    padding:13px;

    border-radius:8px;

    display:none;

    text-align:center;

    font-weight:bold;

}

.success{
    background:#e7f8ef;
    color:#087f5b;
}

.error{
    background:#ffecec;
    color:#c0392b;
}

/* ================= MATERIAL LIST ================= */

.material-list{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(270px,1fr)
    );

    gap:20px;

}

.material{

    border:1px solid #e1e7ee;

    border-radius:13px;

    padding:20px;

    background:white;

    transition:.2s;

}

.material:hover{

    transform:translateY(-3px);

    box-shadow:
    0 8px 20px rgba(0,0,0,.08);

}

.material-icon{
    font-size:40px;
    margin-bottom:10px;
}

.material h3{
    color:#071952;
    margin-bottom:10px;
}

.material p{
    color:#667085;
    margin:7px 0;
    line-height:1.5;
}

/* ================= BADGES ================= */

.badge{

    display:inline-block;

    padding:6px 10px;

    border-radius:15px;

    font-size:12px;

    font-weight:bold;

}

.free-badge{

    background:#e7f8ef;

    color:#087f5b;

}

.paid-badge{

    background:#fff3cd;

    color:#9a6700;

}

.category-badge{

    background:#eaf7f7;

    color:#087f8d;

}

/* ================= BUTTONS ================= */

.view-btn{

    display:block;

    text-align:center;

    margin-top:15px;

    padding:10px;

    background:#071952;

    color:white;

    text-decoration:none;

    border-radius:7px;

    font-weight:bold;

}

.delete-btn{

    width:100%;

    margin-top:8px;

    padding:10px;

    border:none;

    border-radius:7px;

    background:#e74c3c;

    color:white;

    font-weight:bold;

    cursor:pointer;

}

.empty{

    text-align:center;

    padding:35px;

    color:#667085;

}

/* ================= WHATSAPP ================= */

.whatsapp{

    display:block;

    text-align:center;

    text-decoration:none;

    background:#25D366;

    color:white;

    padding:14px;

    border-radius:30px;

    font-weight:bold;

    margin-top:20px;

}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{

        flex-direction:column;

        gap:15px;

        text-align:center;

    }

    .header-buttons{

        flex-wrap:wrap;

        justify-content:center;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .form-group.full{

        grid-column:auto;
    }

    .container{

        width:94%;
    }

}

</style>

</head>

<script>

/* =================================================
   SUPABASE CONNECTION
================================================= */

const SUPABASE_URL =
"https://weinnjprzipdhjbygdmg.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlaW5uanByemlwZGhqYnlnZG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1Njc4MTUsImV4cCI6MjEwMjE0MzgxNX0.D1WfA0T2IorMgjTg1-WE30FdZo9oHLOZbT28WuQmd6s";


/* =================================================
   LOGIN SESSION
================================================= */

const ACCESS_TOKEN =
localStorage.getItem(
    "matitohb_access_token"
);


const USER_DATA =
localStorage.getItem(
    "matitohb_user"
);


if(!ACCESS_TOKEN){

    window.location.href =
        "login.html";

}


/* =================================================
   ELEMENTS
================================================= */

const form =
document.getElementById(
    "uploadForm"
);

const message =
document.getElementById(
    "message"
);

const button =
document.getElementById(
    "uploadButton"
);

const materialsList =
document.getElementById(
    "materialsList"
);

const userInfo =
document.getElementById(
    "userInfo"
);

const typeSelect =
document.getElementById(
    "type"
);

const priceBox =
document.getElementById(
    "priceBox"
);

const priceInput =
document.getElementById(
    "price"
);


/* =================================================
   SHOW USER
================================================= */

if(USER_DATA){

    try{

        const user =
            JSON.parse(USER_DATA);

        userInfo.textContent =
            "👤 Admin: " +
            (user.email || "Admin");

    }

    catch(error){

        userInfo.textContent =
            "👤 Admin";

    }

}

else{

    userInfo.textContent =
        "👤 Admin";

}


/* =================================================
   FREE / PAID
================================================= */

typeSelect.addEventListener(
    "change",
    function(){

        if(this.value === "PAID"){

            priceBox.classList.add(
                "show"
            );

            priceInput.required =
                true;

        }

        else{

            priceBox.classList.remove(
                "show"
            );

            priceInput.required =
                false;

            priceInput.value =
                "0";

        }

    }
);


/* =================================================
   MESSAGE
================================================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =================================================
   HEADERS
================================================= */

function getHeaders(){

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " +
            ACCESS_TOKEN

    };

}


/* =================================================
   LOAD MATERIALS
================================================= */

async function loadMaterials(){

    materialsList.innerHTML = `

        <div class="empty">

            ⏳ Inapakia materials...

        </div>

    `;


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/materials?select=*&order=id.desc",

            {

                method:"GET",

                headers:getHeaders()

            }

        );


        if(!response.ok){

            const error =
                await response.text();

            throw new Error(
                "Database: " +
                error
            );

        }


        const materials =
            await response.json();


        if(
            !materials ||
            materials.length === 0
        ){

            materialsList.innerHTML = `

                <div class="empty">

                    📭 Hakuna materials bado.

                </div>

            `;

            return;

        }


        materialsList.innerHTML = "";


        materials.forEach(
            function(material){

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "material";


                const title =
                    material.title ||
                    "Material";


                const course =
                    material.course ||
                    "General";


                const category =
                    material.category ||
                    "Other";


                const type =
                    String(
                        material.type ||
                        "FREE"
                    ).toUpperCase();


                const price =
                    Number(
                        material.price || 0
                    );


                const description =
                    material.description ||
                    "Hakuna maelezo";


                const fileUrl =
                    material.file_url ||
                    "#";


                let typeBadge = "";


                if(type === "PAID"){

                    typeBadge = `

                        <span class="badge paid-badge">

                            💰 PAID
                            ${formatPrice(price)}

                        </span>

                    `;

                }

                else{

                    typeBadge = `

                        <span class="badge free-badge">

                            🆓 FREE

                        </span>

                    `;

                }


                item.innerHTML = `

                    <div class="material-icon">

                        📚

                    </div>


                    <h3>

                        ${escapeHTML(title)}

                    </h3>


                    <p>

                        🎓
                        <strong>
                            Course:
                        </strong>

                        ${escapeHTML(course)}

                    </p>


                    <p>

                        <span class="badge category-badge">

                            ${escapeHTML(category)}

                        </span>

                        &nbsp;

                        ${typeBadge}

                    </p>


                    ${
                        type === "PAID"
                        ?
                        `

                        <p>

                            💵

                            <strong>
                                Bei:
                            </strong>

                            ${formatPrice(price)}

                        </p>

                        `
                        :
                        ""
                    }


                    <p>

                        ${escapeHTML(description)}

                    </p>


                    ${
                        fileUrl !== "#"
                        ?

                        `

                        <a
                            href="${escapeAttribute(fileUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="view-btn"
                        >

                            👁️ Fungua Material

                        </a>

                        `

                        :

                        ""

                    }


                    <button
                        class="delete-btn"
                        onclick="deleteMaterial(
                            '${escapeJS(String(material.id))}',
                            '${escapeJS(material.file_url || "")}'
                        )"
                    >

                        🗑️ Delete

                    </button>

                `;


                materialsList.appendChild(
                    item
                );

            }
        );

    }

    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        materialsList.innerHTML = `

            <div class="empty">

                ❌ Imeshindwa kupata materials.

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


/* =================================================
   UPLOAD MATERIAL
================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const title =
            document
            .getElementById("title")
            .value
            .trim();


        const course =
            document
            .getElementById("course")
            .value
            .trim();


        const category =
            document
            .getElementById("category")
            .value;


        const type =
            document
            .getElementById("type")
            .value;


        const description =
            document
            .getElementById("description")
            .value
            .trim();


        const file =
            document
            .getElementById("file")
            .files[0];


        let price =
            Number(
                document
                .getElementById("price")
                .value || 0
            );


        /* VALIDATE FILE */

        if(!file){

            showMessage(
                "❌ Chagua file kwanza.",
                "error"
            );

            return;

        }


        /* VALIDATE PAID */

        if(
            type === "PAID" &&
            price <= 0
        ){

            showMessage(
                "❌ Weka bei ya material ya PAID.",
                "error"
            );

            return;

        }


        if(type === "FREE"){

            price = 0;

        }


        button.disabled =
            true;

        button.textContent =
            "⏳ Inapakia...";


        try{

            /* =========================
               FILE NAME
            ========================= */

            const safeName =
                file.name
                .replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const filePath =
                "materials/" +
                Date.now() +
                "_" +
                safeName;


            /* =========================
               STORAGE UPLOAD
            ========================= */

            const uploadResponse =
            await fetch(

                SUPABASE_URL +
                "/storage/v1/object/matitohb/" +
                filePath,

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            ACCESS_TOKEN,

                        "Content-Type":
                            file.type ||
                            "application/octet-stream"

                    },

                    body:file

                }

            );


            if(!uploadResponse.ok){

                const error =
                    await uploadResponse.text();

                throw new Error(
                    "Storage: " +
                    error
                );

            }


            /* =========================
               PUBLIC URL
            ========================= */

            const fileUrl =
                SUPABASE_URL +
                "/storage/v1/object/public/matitohb/" +
                filePath;


            /* =========================
               DATABASE INSERT
            ========================= */

            const databaseResponse =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/materials",

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            ACCESS_TOKEN,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body:JSON.stringify({

                        title:
                            title,

                        course:
                            course,

                        category:
                            category,

                        type:
                            type,

                        price:
                            price,

                        is_paid:
                            type === "PAID",

                        description:
                            description,

                        file_url:
                            fileUrl,

                        file_name:
                            file.name

                    })

                }

            );


            /* DATABASE ERROR */

            if(!databaseResponse.ok){

                const error =
                    await databaseResponse.text();


                /* DELETE STORAGE FILE */

                await fetch(

                    SUPABASE_URL +
                    "/storage/v1/object/matitohb/" +
                    filePath,

                    {

                        method:"DELETE",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                ACCESS_TOKEN

                        }

                    }

                );


                throw new Error(
                    "Database: " +
                    error
                );

            }


            /* SUCCESS */

            showMessage(

                type === "PAID"

                ?

                "✅ Premium material imehifadhiwa. Bei: " +
                formatPrice(price)

                :

                "✅ FREE material imehifadhiwa vizuri!",

                "success"

            );


            form.reset();


            priceBox.classList.remove(
                "show"
            );


            priceInput.required =
                false;


            priceInput.value =
                "0";


            await loadMaterials();

        }


        catch(error){

            console.error(
                "UPLOAD ERROR:",
                error
            );


            showMessage(

                "❌ " +
                error.message,

                "error"

            );

        }


        finally{

            button.disabled =
                false;

            button.textContent =
                "📤 Upload Material";

        }

    }
);


/* =================================================
   DELETE MATERIAL
================================================= */

async function deleteMaterial(
    id,
    fileUrl
){

    const confirmed =
        confirm(
            "Una uhakika unataka kufuta material hii?"
        );


    if(!confirmed){

        return;

    }


    try{

        /* =========================
           DELETE DATABASE
        ========================= */

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/materials?id=eq." +
            encodeURIComponent(id),

            {

                method:"DELETE",

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        ACCESS_TOKEN,

                    "Prefer":
                        "return=minimal"

                }

            }

        );


        if(!response.ok){

            const error =
                await response.text();

            throw new Error(
                "Database: " +
                error
            );

        }


        /* =========================
           DELETE STORAGE
        ========================= */

        if(fileUrl){

            const marker =
                "/object/public/matitohb/";


            const position =
                fileUrl.indexOf(
                    marker
                );


            if(position !== -1){

                const filePath =
                    fileUrl.substring(
                        position +
                        marker.length
                    );


                await fetch(

                    SUPABASE_URL +
                    "/storage/v1/object/matitohb/" +
                    filePath,

                    {

                        method:"DELETE",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                ACCESS_TOKEN

                        }

                    }

                );

            }

        }


        showMessage(

            "✅ Material imefutwa.",

            "success"

        );


        await loadMaterials();

    }


    catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );


        showMessage(

            "❌ Imeshindwa kufuta: " +
            error.message,

            "error"

        );

    }

}


/* =================================================
   FORMAT PRICE
================================================= */

function formatPrice(
    value
){

    const number =
        Number(value || 0);


    if(number <= 0){

        return "FREE";

    }


    return number.toLocaleString(
        "en-US"
    ) + " TZS";

}


/* =================================================
   LOGOUT
================================================= */

function logout(){

    localStorage.removeItem(
        "matitohb_access_token"
    );

    localStorage.removeItem(
        "matitohb_refresh_token"
    );

    localStorage.removeItem(
        "matitohb_user"
    );


    window.location.href =
        "login.html";

}


/* =================================================
   SECURITY HELPERS
================================================= */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text || "");

    return div.innerHTML;

}


function escapeAttribute(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


function escapeJS(text){

    return String(text || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}
